name: Deploy Stillspace to GitHub Pages

# Manual release only. Never dispatch again after the competition freeze.
# This file must be at .github/workflows/pages.yml in a standalone project repo.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stillspace-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out selected release
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test focus state and persistence
        run: npm test
      - name: Build static production site
        run: npm run build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy selected release
        id: deployment
        uses: actions/deploy-pages@v4
